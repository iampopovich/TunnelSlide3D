name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write   # attach files to the GitHub Release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Job-level so that `if:` can see whether signing is configured.
      HAS_KEYSTORE: ${{ secrets.TS_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew :core:test

      # Signing secrets are optional: without them the release APK is unsigned.
      - name: Restore release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.TS_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > release.jks

      # Fails early with a readable reason (prints sizes and aliases only, never secrets).
      - name: Check release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          STORE_PASS: ${{ secrets.TS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TS_KEY_ALIAS }}
        run: |
          echo "keystore bytes: $(wc -c < release.jks), alias length: ${#KEY_ALIAS}, password length: ${#STORE_PASS}"
          keytool -list -keystore release.jks -storepass "$STORE_PASS" | grep -iE 'entry|keystore type' || { echo "::error::keytool cannot open release.jks: wrong TS_KEYSTORE_PASSWORD or broken TS_KEYSTORE_B64"; exit 1; }
          keytool -list -keystore release.jks -storepass "$STORE_PASS" -alias "$KEY_ALIAS" > /dev/null || { echo "::error::alias '$KEY_ALIAS' not found in release.jks (TS_KEY_ALIAS)"; exit 1; }

      - name: Build APK and desktop jar
        env:
          TS_KEYSTORE: ${{ env.HAS_KEYSTORE == 'true' && 'release.jks' || '' }}
          TS_KEYSTORE_PASSWORD: ${{ secrets.TS_KEYSTORE_PASSWORD }}
          TS_KEY_ALIAS: ${{ secrets.TS_KEY_ALIAS }}
          TS_KEY_PASSWORD: ${{ secrets.TS_KEY_PASSWORD }}
        run: ./gradlew :android:assembleRelease :lwjgl3:dist :web:gdx_teavm_web_js_release_build --stacktrace

      - name: Collect artifacts
        run: |
          mkdir out
          for f in android/build/outputs/apk/release/*.apk; do
            cp "$f" "out/TunnelSlide3D-${GITHUB_REF_NAME//\//-}-$(basename "$f" | sed 's/android-//')"
          done
          cp lwjgl3/build/dist/*.jar out/
          (cd web/build/dist/js/release/webapp && zip -qr "$GITHUB_WORKSPACE/out/TunnelSlide3D-web.zip" . -x 'WEB-INF/*')

      - uses: actions/upload-artifact@v4
        with:
          name: tunnelslide3d
          path: out/*

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
